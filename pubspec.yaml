name: mood_ring_weather
description: Mood-Ring Weather — 体感快適度 (MRI) を色と数値で見せる天気アプリ。
publish_to: "none"
version: 1.3.0+16

# 注意 (spec.md §21):
#   本 pubspec はまず「国際化 (i18n) 基盤」を成立させるための seed。
#   既存の純 Dart モジュール (lib/data, lib/domain) と l10n を解決し、
#   `flutter gen-l10n` / `flutter test` を通すための最小依存のみを宣言する。
#   画面実装 (main.dart / Home 等) を追加する際にこの土台へ積み増す。

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  # 多言語: ARB → AppLocalizations 生成 + 各言語のデリゲート
  flutter_localizations:
    sdk: flutter
  intl: any # flutter_localizations がピン留めするバージョンに従う
  # 状態管理 (spec.md §2.1 — Riverpod)
  flutter_riverpod: ^2.5.1
  # 言語の手動選択をオンデバイス永続化 (spec.md §13 プライバシー: オンデバイス完結)
  shared_preferences: ^2.2.3
  # 天気 API (Open-Meteo。キー不要。将来 Cloudflare Workers 経由に切替予定)
  # 1.5.0+ : 地名検索の取り消し (AbortableRequest) に使う。lock は 1.6.0。
  http: ^1.5.0
  # 現在地 (COARSE のみ。spec §13: 履歴非保持)
  geolocator: ^13.0.1
  # 座標 → 都市名の表示用逆ジオコーディング (OS ジオコーダ。キー不要)
  geocoding: ^3.0.0
  flutter_local_notifications: ^22.0.0
  purchases_flutter: ^10.3.0
  firebase_core: ^4.11.0
  # 緊急プッシュ (FCM data push。docs/notification-delivery-design.md §5 / 計画 S8)。
  # 16.4.1 は firebase_core ^4.11.0 と整合する最新 (16.5+ は core 4.13+ を要求し、
  # 配信中 1.2.0+6 の Firebase 各 SDK を巻き上げるため意図的に上げない)。
  firebase_messaging: ^16.4.1
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # ランチャーアイコン生成 (設定は flutter_launcher_icons.yaml)
  flutter_launcher_icons: ^0.14.3

flutter:
  # Material アイコンフォント (Icons.*) を同梱。無いと下部ナビ等が豆腐文字化する
  uses-material-design: true
  # gen-l10n を有効化 (l10n.yaml を参照して AppLocalizations を生成)
  generate: true
  assets:
    # Comfort-Twin の候補都市カタログ (世界の主要都市。オフライン同梱)
    - assets/cities.json
    # 同梱フォントのライセンス本文 (OFL 1.1)。アプリ内ライセンス画面に表示する
    - assets/fonts/OFL-Fraunces.txt
    - assets/fonts/OFL-Inter.txt
    - assets/fonts/OFL-IBMPlexMono.txt
    - assets/fonts/OFL-IBMPlexSansJP.txt

  # v1.3 タイポグラフィ (Figma sthT6fxeWWF33f9vENzFWW 実測。docs/v1.3-design-implementation-plan.md §2):
  #   EN = Fraunces (見出し・可変: wght/opsz/SOFT/WONK) / Inter (数値・本文・可変: wght/opsz) /
  #        IBM Plex Mono (ラベル・メタ)
  #   JA = IBM Plex Sans JP (Regular / Medium / Bold。フルセット同梱、サブセット化は未実施)
  # すべて SIL OFL 1.1。ライセンス本文は assets/fonts/OFL-*.txt を同梱し、
  # LicenseRegistry (presentation/theme/font_licenses.dart) でアプリ内ライセンス画面に載せる。
  # オフライン初回起動でも崩れないよう .ttf を同梱する (google_fonts のランタイム取得は使わない)。
  # 可変フォントは weight を宣言せず、TextStyle.fontVariations で軸を指定する (app_theme.dart)。
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
    - family: IBMPlexSansJP
      fonts:
        - asset: assets/fonts/IBMPlexSansJP-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansJP-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansJP-Bold.ttf
          weight: 700
